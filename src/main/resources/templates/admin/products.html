<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('상품 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="content">
    <h2>상품 관리</h2>
    <p class="message" th:if="${notice}" th:text="${notice}"></p>
    <p>
        <a class="button" th:href="@{/admin/products/new}">상품 등록</a>
        <button type="button" data-stock-resync>전체 Redis 재고 재동기화</button>
    </p>
    <p id="message" class="message" role="status"></p>
    <table class="admin">
        <thead>
        <tr><th>ID</th><th>카테고리</th><th>상품명</th><th>가격</th><th>가용 재고(Redis)</th><th>상태</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.categoryName}">카테고리</td>
            <td th:text="${p.name}">상품</td>
            <td th:text="${#numbers.formatInteger(p.price, 1, 'COMMA')} + '원'">0원</td>
            <td th:text="${available[p.id]}">0</td>
            <td th:text="${p.onSale()} ? '판매 중' : '판매 중지'">판매 중</td>
            <td><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">수정</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
