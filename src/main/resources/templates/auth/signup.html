<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="content narrow">
    <h2>회원가입</h2>
    <form method="post" th:action="@{/signup}" th:object="${form}" class="stack">
        <label>이메일 <input type="email" th:field="*{email}" required maxlength="100"></label>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">오류</p>
        <label>비밀번호 (8자 이상) <input type="password" th:field="*{password}" required minlength="8" maxlength="64"></label>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">오류</p>
        <label>이름 <input type="text" th:field="*{name}" required maxlength="50"></label>
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">오류</p>
        <button type="submit">가입하기</button>
    </form>
</main>
</body>
</html>
