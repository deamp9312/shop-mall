<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="content narrow">
    <h2>로그인</h2>
    <p class="message error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="message error" th:if="${param.locked}">로그인 실패가 5회를 넘어 5분 동안 로그인할 수 없습니다.</p>
    <p class="message" th:if="${param.registered}">가입이 완료되었습니다. 로그인해 주세요.</p>
    <form method="post" th:action="@{/login}" class="stack">
        <label>이메일 <input type="email" name="email" required autocomplete="username"></label>
        <label>비밀번호 <input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit">로그인</button>
    </form>
    <p><a th:href="@{/signup}">회원가입</a></p>
</main>
</body>
</html>
