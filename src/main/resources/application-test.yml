# test profile: connection info is injected from Testcontainers (IntegrationTestSupport).
# No seed data here (REQ-DA-003).
spring:
  flyway:
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        # REQ-F-004 1): lets tests count SQL statements to prove the second product read hits the cache
        generate_statistics: true

shop:
  order:
    # REQ-F-010: tests set an order's deadline into the past and wait for the job instead of a whole minute
    timeout-check-interval: PT1S
  payment:
    mock-delay: 1s
  demo:
    # REQ-F-014 3) verification needs the failure switch
    failure-switch-enabled: true
