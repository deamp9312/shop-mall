# 공통 설정. 비밀 값은 환경 변수로만 받는다(REQ-SE-003, .env.example 참고).
spring:
  application:
    name: shop-mall
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shop}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # REQ-IF-002 / REQ-NF-002 5): 프로듀서 재시도로 인한 유실·중복 쓰기를 막는다. exactly-once는 범위 밖이다
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 전송은 10초 안에 포기하므로 장애 중에도 outbox relay(event/OutboxRelay)가 몇 분씩 기다리지 않는다
        max.block.ms: 10000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # 새 컨슈머 그룹은 가장 오래된 레코드부터 읽으므로 그룹 합류 전에 발행된 이벤트를 건너뛰지 않는다
      auto-offset-reset: earliest
    listener:
      # REQ-NF-002 1): 레코드마다 오프셋을 커밋한다(핸들러는 이미 DB 트랜잭션을 커밋한 상태다)
      ack-mode: record
  task:
    scheduling:
      # OutboxRelay, PaymentTimeoutJob, mock PG 지연 응답이 스케줄러를 공유한다. 스레드가 하나뿐이면 Kafka 장애로
      # 막힌 relay(전송당 최대 max.block.ms)가 타임아웃 처리와 지연 승인까지 붙잡게 된다.
      pool:
        size: 3
  cache:
    # REQ-F-004: 캐시는 상품 캐시 하나뿐이다. TTL과 JSON 직렬화기는 ProductCacheConfig에서 설정한다
    cache-names: product

shop:
  order:
    # REQ-F-006 2), REQ-F-010 4): 결제 마감 = 주문 시각 + 15분. 로컬에서 자동 취소를 시연할 때는
    # SHOP_PAYMENT_TIMEOUT=1m으로 줄인다.
    payment-timeout: ${SHOP_PAYMENT_TIMEOUT:15m}
    # REQ-F-010 1): PaymentTimeoutJob이 마감이 지난 주문을 찾는 주기(ISO-8601 duration)
    timeout-check-interval: PT1M
  payment:
    # REQ-F-008 2): [응답 지연] 시 mock PG가 응답하기까지의 지연 시간
    mock-delay: 10s
  demo:
    # REQ-F-014 3): 관리자 이벤트 화면의 컨슈머 실패 스위치. local 프로파일에서만 켠다.
    failure-switch-enabled: false

server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-components: always

logging:
  pattern:
    # REQ-NF-003: 시각, 레벨, traceId, orderId, 모듈(logger), 메시지
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:--}] [orderId=%X{orderId:--}] [%thread] %logger{40} - %msg%n"
